packages:
  - .

catalogMode: manual

engineStrict: true

hoist: false

ignoreDepScripts: true

minimumReleaseAge: 10800

minimumReleaseAgeExclude:
  - '@bbc/*'
  - '@ibl/*'


publicHoistPattern:
  - eslint-*
  - '@eslint/*'
  - '@typescript-eslint/*'
  - jest
  - taffydb

recursiveInstall: false

sharedWorkspaceLockfile: false
